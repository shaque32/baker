[project]
name = "baker"
version = "0.0.1"
description = "Local-first audit of government claims about phone evidence"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3",
    "pypdfium2>=4.30,<6",  # PDF text (Apache-2.0 / BSD-3)
    "pillow>=10",  # page images for OCR; OCR itself needs a local Tesseract install
    "openpyxl>=3.1,<4",  # Cellebrite Excel reports (MIT)
    "pdfplumber>=0.11,<0.12",  # Cellebrite PDF report tables (MIT; pulls pdfminer.six, MIT)
    "tzdata>=2024.1",  # IANA zone database for zoneinfo on Windows (Apache-2.0)
]

[project.scripts]
baker = "cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "reportlab>=4",  # synthetic fixture PDFs only (eval/synthetic, tests)
]
local = [
    "llama-cpp-python>=0.3.16",  # local GGUF runtime (MIT); install the CUDA build on the GPU PC
]
bench = [
    "anthropic>=1.0,<2",  # eval/bench only: cloud upper bound, never imported by core/ (MIT)
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "eval*", "cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S105", "S106"]  # enum values like "pass" are not passwords

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S608"]  # tests build SQL from constants only
"eval/synthetic/xlsx.py" = ["E501"]  # OOXML namespace URLs
"eval/probe/build_smoke.py" = ["E501"]  # probe item text
