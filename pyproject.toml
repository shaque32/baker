[project]
name = "baker"
version = "0.0.1"
description = "Local-first audit of government claims about phone evidence"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "openpyxl>=3.1",  # tests read the synthetic Excel reports
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S105", "S106"]  # enum values like "pass" are not passwords

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S608"]  # tests build SQL from constants only
"eval/synthetic/xlsx.py" = ["E501"]  # OOXML namespace URLs
