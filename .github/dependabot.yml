# Dependabot version updates: one grouped PR a month per ecosystem, so updates arrive as a
# reviewable batch, not a stream. Security updates for a known vulnerability are separate: they
# come from the repository's Dependabot security updates setting, as soon as an advisory lands.
# A Dependabot PR has no "Merge order" section, so the merge bot skips it (docs/MERGING.md
# section 1) until a project thread takes it over and adds one.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
